<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Date Invitation ❤️</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="proposal">

<h1>Will You Go On A Date With Me? ❤️</h1>

<div class="buttons">
    <button id="yesBtn">YES ❤️</button>
    <button id="noBtn">NO 💔</button>
</div>

<h2 id="result"></h2>

</div>

<div class="container">

    <h1>💕 Date Planner 💕</h1>

    <p class="subtitle">
        Let's plan our perfect date together ❤️
    </p>

    <form id="dateForm">

        <label>Your Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label>Select Date</label>
        <input type="date" id="date" required>

        <label>Select Time</label>
        <input type="time" id="time" required>

        <label>Choose Activity</label>

        <select id="activity">
            <option>Coffee ☕</option>
            <option>Movie 🎬</option>
            <option>Dinner 🍽️</option>
            <option>Long Drive 🚗</option>
            <option>Beach Walk 🌊</option>
            <option>Shopping 🛍️</option>
            <option>Ice Cream 🍦</option>
            <option>Sunset 🌅</option>
        </select>

        <label>Special Message</label>

        <textarea id="message" rows="4"
        placeholder="Write something sweet..."></textarea>

        <button type="submit">
            Continue ❤️
        </button>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
